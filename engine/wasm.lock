# Pinned hledger WebAssembly engine. Single source of truth for which hledger
# binary the app runs. Read by engine/scripts/fetch.sh (download + sha256 check)
# and by astro.config.mjs (versioned asset name, engine version in Settings).
#
# Keep the flat `key = "value"` form: a tiny awk/regex parser reads it.
#
# flavor: "hledger-cli" = the real hledger executable built for wasm32-wasi,
#         invoked as a WASI command (Option A, see docs/DECISIONS.md D-001).
#
# Provenance: built from unmodified hledger 1.52.4 with ghc-wasm-meta (GHC 9.12)
# by lc-at/hledger-anywhere (GPL-3.0). engine.yml reproduces the build for this
# repository; when it publishes our own release asset, update url/sha256/size.

flavor = "hledger-cli"
hledger_version = "1.52.4"
ghc_version = "9.12"
size = "13194161"
sha256 = "acd7c4e955b1191a23afc5171508cba960cf8311cf5f8fb8a9f62f50659e4178"
url = "https://github.com/lc-at/hledger-anywhere/releases/download/wasm-v2/hledger.wasm"

# Option B: hledger as a reactor module (parse once, many reports). Built by
# engine/scripts/build.sh / engine.yml from hledger commit 33fa849e (1.52.4).
# Published by engine.yml as release engine-v1.52.4 (CI builds are reproducible;
# a local build differs by a few bytes, so pin the release). The app falls back
# to the CLI module above if the reactor is unavailable.
reactor_url = "https://github.com/jackhale98/pocketledger-web/releases/download/engine-v1.52.4/hledger-reactor.wasm"
reactor_jsffi_url = "https://github.com/jackhale98/pocketledger-web/releases/download/engine-v1.52.4/hledger-reactor.jsffi.mjs"
reactor_sha256 = "d0b167521ec4547b4c972c628e424ced81c9b0d51a4dacd9c6a94af3f035d4f6"
reactor_jsffi_sha256 = "acb55816a681ae098b33886c7b44fd5d33ded40393b295c1c1c5fc54473ed052"
reactor_size = "13269292"
