name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch pinned hledger.wasm (sha256-verified)
        run: sh engine/scripts/fetch.sh
      - name: Typecheck
        run: npm run check
      - name: Unit, fidelity and engine golden tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget
        run: npm run size
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E + axe
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
