# Build the hledger reactor module (engine Option B) and publish it.
#
# Manual run: Actions -> engine -> Run workflow (artifacts only).
# Tag push engine-vX.Y.Z: also creates a GitHub release with the module and
# its JSFFI glue as assets. Update engine/wasm.lock from the printed sha256.
name: engine

on:
  workflow_dispatch:
  push:
    tags: ['engine-v*']

permissions:
  contents: write

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false

env:
  GHC_WASM_PREFIX: /home/runner/.ghc-wasm
  # keep in sync with engine/scripts/build.sh
  GHC_WASM_META_REF: 8079eb96bbc63823d99ad8acaff0765532625474
  GHC_FLAVOUR: '9.12'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Host tools for ghc-wasm-meta's setup.sh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd jq

      # The toolchain is ~2 GB and only changes with GHC_WASM_META_REF.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.ghc-wasm
            !/home/runner/.ghc-wasm/.cabal/store
          key: ghc-wasm-${{ env.GHC_WASM_META_REF }}-${{ env.GHC_FLAVOUR }}

      # ~110 Hackage packages built for wasm32-wasi: most of a cold build.
      - name: Cache cabal store and build dir
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.ghc-wasm/.cabal/store
            engine/artifacts/dist-newstyle
          key: cabal-${{ env.GHC_WASM_META_REF }}-${{ hashFiles('engine/hledger-wasm/**', 'engine/scripts/build.sh') }}
          restore-keys: cabal-${{ env.GHC_WASM_META_REF }}-

      - name: Build
        run: bash engine/scripts/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test (bs -O json through the reactor)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node engine/scripts/drive-reactor.mjs -- -f /vault/example.hledger bs -O json > /tmp/bs.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/bs.json','utf8')); console.log('bs -O json ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: hledger-reactor
          path: |
            engine/artifacts/hledger-reactor.wasm
            engine/artifacts/hledger-reactor.jsffi.mjs
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/engine-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            engine/artifacts/hledger-reactor.wasm
            engine/artifacts/hledger-reactor.jsffi.mjs
          fail_on_unmatched_files: true
