# Build the hledger reactor module (engine Option B) and publish it.
#
# Manual run: Actions -> engine -> Run workflow. Leave "release" empty for a
# build artifact only, or give a tag (e.g. engine-v1.52.4) to also publish a
# GitHub release with the module and its JSFFI glue as assets.
# Tag push engine-vX.Y.Z does the same. Then pin the printed sha256 values and
# the asset URLs in engine/wasm.lock (reactor_*).
name: engine

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish (e.g. engine-v1.52.4); empty = artifact only'
        required: false
        default: ''
  push:
    tags: ['engine-v*']

permissions:
  contents: write

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false

env:
  GHC_WASM_PREFIX: /home/runner/.ghc-wasm
  # keep in sync with engine/scripts/build.sh
  GHC_WASM_META_REF: 8079eb96bbc63823d99ad8acaff0765532625474
  GHC_FLAVOUR: '9.12'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Host tools for ghc-wasm-meta's setup.sh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd jq

      # The toolchain is ~2 GB and only changes with GHC_WASM_META_REF.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.ghc-wasm
            !/home/runner/.ghc-wasm/.cabal/store
          key: ghc-wasm-${{ env.GHC_WASM_META_REF }}-${{ env.GHC_FLAVOUR }}

      # ~110 Hackage packages built for wasm32-wasi: most of a cold build.
      - name: Cache cabal store and build dir
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.ghc-wasm/.cabal/store
            engine/artifacts/dist-newstyle
          key: cabal-${{ env.GHC_WASM_META_REF }}-${{ hashFiles('engine/hledger-wasm/**', 'engine/scripts/build.sh') }}
          restore-keys: cabal-${{ env.GHC_WASM_META_REF }}-

      - name: Build
        run: bash engine/scripts/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test (bs -O json through the reactor)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node engine/scripts/drive-reactor.mjs -- -f /vault/example.hledger bs -O json > /tmp/bs.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/bs.json','utf8')); console.log('bs -O json ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: hledger-reactor
          path: |
            engine/artifacts/hledger-reactor.wasm
            engine/artifacts/hledger-reactor.jsffi.mjs
          if-no-files-found: error

      - name: Checksums
        run: |
          {
            echo '### hledger reactor engine'
            echo '```'
            sha256sum engine/artifacts/hledger-reactor.wasm engine/artifacts/hledger-reactor.jsffi.mjs
            wc -c engine/artifacts/hledger-reactor.wasm
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum engine/artifacts/hledger-reactor.wasm engine/artifacts/hledger-reactor.jsffi.mjs

      - name: Release
        if: startsWith(github.ref, 'refs/tags/engine-v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release || github.ref_name }}
          body: hledger 1.52.4 compiled to wasm32-wasi as a reactor module (PocketLedger engine, Option B). Pin the sha256 values from the run summary in engine/wasm.lock.
          files: |
            engine/artifacts/hledger-reactor.wasm
            engine/artifacts/hledger-reactor.jsffi.mjs
          fail_on_unmatched_files: true
